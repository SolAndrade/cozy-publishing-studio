name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cozy
          POSTGRES_PASSWORD: cozy
          POSTGRES_DB: cozy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cozy -d cozy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COZY_TEST_DATABASE_URL: postgresql://cozy:cozy@localhost:5432/cozy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e . Pillow ReportLab PyMuPDF
      - run: python -m unittest discover -s tests -v
      - name: Check frontend JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/api.js
          node --check src/production.js
          node --check src/status.js
